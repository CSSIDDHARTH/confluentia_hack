[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfsense"
version = "0.1.0"
description = "AI retail shelf compliance: planogram, price-label and availability checks"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pillow>=10.0",
    "pandas>=2.0",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Person A (vision pipeline): detector, embeddings. Heavy: pulls PyTorch.
vision = ["ultralytics>=8.3", "opencv-python-headless>=4.9"]
# Real label OCR (shelfsense.pricing.label_ocr.read_label_text) also
# needs the `tesseract` binary on PATH -- not pip-installable, see
# data/README.md. Without it, parse_price() and price_check still work
# fully; only OCR-from-image-crop is unavailable.
ocr = ["pytesseract>=0.3"]
# Optional second OCR engine that votes with Tesseract (needs torch). Without it only Tesseract votes.
ocr-easy = ["easyocr>=1.7"]
# Small language model for the shift-briefing summary; model file: python scripts/download_data.py slm
slm = ["llama-cpp-python>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
