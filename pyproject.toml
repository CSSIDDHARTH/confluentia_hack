[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfsense"
version = "0.1.0"
description = "AI retail shelf compliance: planogram, price-label and availability checks"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pillow>=10.0",
    "pandas>=2.0",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Person A (vision pipeline): detector, embeddings. Heavy: pulls PyTorch.
vision = ["ultralytics>=8.3", "opencv-python-headless>=4.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
